[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-hub"
version = "0.1.0"
description = "An identity-aware MCP gateway and isolated server runtime"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "mcp>=1.30,<2", "starlette>=1.8,<2", "uvicorn>=0.35,<1",
  "httpx>=0.28,<1", "redis>=6,<9", "cryptography>=50,<51",
  "certifi>=2026.10.19",
  "pydantic>=2.11,<3", "pydantic-settings>=2.9,<3", "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=25,<26", "prometheus-client>=0.22,<1", "docker>=7.1,<8",
  "PyYAML>=6,<7", "python-multipart>=0.0.20,<1",
  "opentelemetry-sdk>=1.35,<2", "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "typer>=0.16,<1",
  "packaging>=25,<27", "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8",
  "fakeredis[lua]>=2.30,<3", "hypothesis>=6.135,<7", "ruff>=0.12,<1",
  "mypy>=1.16,<2", "types-PyYAML>=6,<7", "types-docker>=7,<8",
]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["docker: live Docker isolation and lifecycle tests", "live: real TCP MCP and Redis tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["mcp_hub"]
branch = true
