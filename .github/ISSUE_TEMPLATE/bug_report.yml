name: Bug report
description: Report unexpected behavior in MCP Hub.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and steps to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant logs
      description: Remove tokens, credentials and private source code before sharing logs.
