name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.1'
      - run: python scripts/check_private_boundaries.py
      - run: uv sync --frozen --extra dev
      - if: matrix.python == '3.13'
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/mcp-runtime.txt" > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit --require-hashes -r "$RUNNER_TEMP/mcp-runtime.txt"
      - run: uv run ruff check src tests deploy/operations.py deploy/restore_check.py
      - run: uv run ruff format --check src tests deploy/operations.py deploy/restore_check.py
      - run: uv run mypy src/mcp_hub
      - run: uv run pytest -m 'not docker' --cov=mcp_hub --cov-report=term-missing
        env:
          MCP_HUB_RUN_LIVE: '1'
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check_private_boundaries.py
        working-directory: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npx prettier --check src tests tsconfig.json vite.config.ts playwright.config.ts
      - run: npm run build
  docker-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check_private_boundaries.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: uv sync --frozen --extra dev
      - run: python3 scripts/dev.py
      - run: sudo -n env PYTHONDONTWRITEBYTECODE=1 MCP_HUB_RUN_DOCKER=1 .venv/bin/python -m pytest tests/integration/test_docker_runtime.py -p no:cacheprovider
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose -f compose.yaml -f compose.demo.yaml down
