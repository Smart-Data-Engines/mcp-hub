version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: '07:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    labels: [dependencies]
    # Routine version PRs stay on the reviewed major lines. Security updates
    # use a separate stream and are not restricted by allow.update-types.
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      python-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: '07:15'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    labels: [dependencies]
    allow:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      console-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '07:30'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: '07:45'
      timezone: Europe/Warsaw
    # Base-runtime migrations require gateway and adapter qualification.
    # A zero version-PR limit leaves the separate security-update stream intact.
    open-pull-requests-limit: 0
    labels: [dependencies]
