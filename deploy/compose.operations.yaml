# Independent audit storage. Never publish its HTTP API on host ports.
name: mcp-hub-operations
services:
  audit:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    container_name: mcp-hub-audit
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
      path.repo: /snapshots
    volumes:
    - audit-data:/usr/share/opensearch/data
    - ${AUDIT_SNAPSHOT_DIR:?Set AUDIT_SNAPSHOT_DIR}:/snapshots
    networks:
    - audit
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 512
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    restart: unless-stopped
volumes:
  audit-data: {}
networks:
  audit:
    name: mcp-hub-audit
    internal: true
